---
- name: Файрвол на всех серверах
  hosts: all
  tasks:
    - name: Разрешаем SSH, HTTP и HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Запрещаем входящее по умолчанию и включаем файрвол
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

- name: Правила сервера с ELK
  hosts: elk
  tasks:
    - name: Logstash и node-exporter только для сервера метрик
      community.general.ufw:
        rule: allow
        from_ip: "{{ hostvars['monitoring-vps']['ansible_host'] }}"
        port: "{{ item }}"
        proto: tcp
      loop:
        - "5044"
        - "9100"

- name: Правила сервера метрик
  hosts: monitoring
  tasks:
    - name: node-exporter только из подсети Docker проекта
      community.general.ufw:
        rule: allow
        from_ip: 172.30.0.0/24
        port: "9100"
        proto: tcp
